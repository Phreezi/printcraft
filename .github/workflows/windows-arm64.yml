# Windows on ARM (#61): package the ARM64 release the way release.yml does (cross-compiled on an
# x64 runner, unsigned here), then install that MSI on a Windows 11 ARM64 runner and run it, and
# run the test suite natively on ARM64.
name: Windows ARM64

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - "**/build.rs"
      - .github/workflows/windows-arm64.yml
      - packaging/windows/**
  schedule:
    - cron: "41 4 * * 1" # weekly, so drift in the runner images shows up
  workflow_dispatch:

concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-arm64:
    # Forks (PeDeeFe) run this only by hand: GitHub disables a fork's workflows when its Actions
    # usage is high.
    if: github.repository == 'storytold/pdfcraft' || github.event_name == 'workflow_dispatch'
    # Intentionally tracked at @main (not SHA-pinned) so org-wide CI improvements, security fixes, and build optimizations propagate without PR churn across all craftapp repos.
    uses: storytold/craft-common-actions/.github/workflows/windows-arm64.yml@main
    with:
      app-name: pdfcraft
      # PeDeeFe installs to Program Files\PeDeeFe as pedeefe.exe (packaging/windows/pdfcraft.wxs),
      # next to an official PdfCraft; the CLI keeps its pdfcraft-cli.exe name.
      app-dir: PeDeeFe
      main-binary: pedeefe.exe
      cli-binary: pdfcraft-cli.exe
